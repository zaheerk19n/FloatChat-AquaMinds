services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: oceanai_user
      POSTGRES_PASSWORD: zaheer
      POSTGRES_DB: OceanAi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./chroma_db:/app/chroma_db
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: